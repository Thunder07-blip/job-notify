# Job Notify – Test Suite Workflow
#
# Runs pytest on pushes and pull requests.

name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -v --tb=short
